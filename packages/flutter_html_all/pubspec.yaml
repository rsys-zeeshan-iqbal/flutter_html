name: flutter_html_all
description: All optional flutter_html widgets, bundled into a single package.
publish_to: none

version: 3.0.0
homepage: https://github.com/Sub6Resources/flutter_html

environment:
  sdk: ">=3.0.0 <=3.5.4"
  flutter: 3.24.5

dependencies:
  flutter:
    sdk: flutter
  flutter_html: 
    path: ../../
  flutter_html_audio: 
    path: ../flutter_html_audio
  flutter_html_iframe: 
    path: ../flutter_html_iframe
  flutter_html_math: 
    path: ../flutter_html_math
  flutter_html_svg: 
    path: ../flutter_html_svg
  flutter_html_table:     
    path: ../flutter_html_table
  flutter_html_video:
    path: ../flutter_html_video

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:
funding:
  - https://github.com/sponsors/Sub6Resources

topics:
  - html
  - css
  - widgets
  - layout
